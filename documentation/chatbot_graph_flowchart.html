<!doctype html>
<meta http-equiv="content-type" content="application/xhtml+xml; charset=utf-8" />
<html>
<head>
    <title>Nesta Brain demo flowchart</title>

    <style type="text/css">
        body {
            font: 10pt sans;
        }

        #mynetwork {
            width: 700px;
            height: 550px;
            background-color: white;
        }

    </style>
    <script type="text/javascript" src="https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="vis-4.21.0/dist/vis-network.min.css" rel="stylesheet" type="text/css"/>

    <!--DRAFT 1-->
    <script type="text/javascript">
        var nodes = null;
        var edges = null;
        var network = null;
        var directionInput = document.getElementById("direction");

        function destroy() {
            if (network !== null) {
                network.destroy();
                network = null;
            }
        }

        function draw() {
            destroy();
            var connectionCount = [];
            height = 40
            h_incr = height + 45;
            width = 150;
            w_incr = width + 80;
            nodes = [
                        {id: 'i1', x:0, y:h_incr*-2, label: "UI",group:'info'},
                      //  {id: 'i2', x:w_incr*1, y:h_incr*-2, label: "",group:'info'},
                        {id: 'sw', x:0, y:h_incr*-1, label: "sidebar widgets",group:'other'},
                        {id: 'fil', x:w_incr*1, y:h_incr*-1, label: "filter conditions",group:'other'},
                        {id: 'dec', x:w_incr*2, y:h_incr*0, label: "policy doc\ndecision",group:'other'},
                        {id: 'prompt', x:w_incr*2, y:h_incr*5, label: "choose prompt",group:'other'},
                        {id: 'adj', x:w_incr*3, y:h_incr*0, label: "adjust retriever\ninput",group:'other'},
                        {id: 'chh', x:0, y:h_incr*2, label: "chat history",group:"data_flow"},
                        {id: 'ret', x:w_incr*3, y:h_incr*2, label: "retriever",group:'other'},
                        {id: 'd1', x:w_incr*-0.5, y:h_incr*2,group:"dummy"},
                        {id: 'd2', x:w_incr*1, y:h_incr*0,group:"dummy"},
                        {id: 'd4', x:w_incr*-0.5, y:h_incr*0,group:"dummy"},
                        {id: 'ui', x:0, y:h_incr*0, label: "user input",group:"data_flow"},
                        {id: 'cx', x:w_incr*1, y:h_incr*4, label: "context",group:"data_flow"},
                        {id: 'p2', x:w_incr*1, y:h_incr*5, label: "Q&A prompt",group:'other'},
                        {id: 'llm2', x:w_incr*1, y:h_incr*6, label: "LLM",group:'other'},
                        {id: 'd3', x:w_incr*-0.5, y:h_incr*5,group:"dummy"},
                        {id: 'op2', x:w_incr*0, y:h_incr*6, label: "response",group:"data_flow"},
                        {id: 'd5', x:w_incr*3, y:h_incr*-1,group:"dummy"},
                        {id: 'd6', x:w_incr*2, y:h_incr*-1,group:'dummy'},
                        {id: 'd7', x:w_incr*1, y:h_incr*1,group:'dummy'},
                        {id: 'd8', x:w_incr*1, y:h_incr*2,group:'dummy'},
                        {id: 'd9', x:w_incr*3, y:h_incr*4,group:'dummy'},
                    ];

            edges = [
                         {from: 'chh', to: 'd1',arrows: {to:false}},
                         {from: 'd4', to: 'd3',arrows: {to:false}},
                         {from: 'd3', to: 'p2'},
                         {from: 'ui', to: 'd4',arrows: {to:false}},
                         {from: 'chh', to: 'ret'},//,arrows: {to:false}},
                         {from: 'd2', to: 'd8',arrows: {to:false}},
                         {from: 'ui', to: 'dec'},
                         {from: 'ui', to: 'd2',arrows: {to:false}},
                         {from: 'p1', to: 'llm1'},
                         {from: 'llm1', to: 'op1'},
                         {from: 'op1', to: 'em'},
                         {from: 'em', to: 'ev'},
                         {from: 'ev', to: 'ldb'},
                         {from: 'ldb', to: 'ch'},
                         {from: 'ch', to: 'cx'},
                         {from: 'cx', to: 'p2'},
                         {from: 'p2', to: 'llm2'},
                         {from: 'llm2', to: 'op2'},
                         {from: 'sw', to: 'fil'},
                         {from: 'fil', to: 'd5',arrows: {to:false}},
                        {from: 'dec', to: 'adj'},
                         {from: 'dec', to: 'prompt'},
                         {from:'d2',to:'d7'},
                         {from:'d5',to:'adj'},
                     //   {from: 'd6', to: 'dec'},
                         {from: 'adj', to: 'ret'},
                         {from: 'ret', to: 'd9',arrows: {to:false}},
                         {from: 'd9', to: 'cx'},
                         {from: 'prompt', to: 'p2'},
                        ];


            // create a network
            var container = document.getElementById('mynetwork');
            var data = {
                nodes: nodes,
                edges: edges
            };

            var options = {
                groups: {
                            dummy: {shape:'dot',color: {background:'white',border:'pink'},size:0},
                            info: {color: {background:'white',border:'white'},font: { size: 20}},
                         //   ghost: {color: {background:null,border:null}},
                            data_flow: {color: {background:'lightgrey',border:'grey'},font: { size: 20}},
                            other: {font: { size: 20}}
                       },
                nodes: {
                            shape: 'box',
                            color:{background:'#84c0f5'},
                            font: {size:14},
                            heightConstraint: {minimum: 40},
                            widthConstraint: {minimum: width, maximum:width}
                       },
                edges: {
                    color:{color:'#84c0f5'},
                    font: {size:10, background:'lightgrey'},
                    arrows: {to:true}
                },
                layout: {
              //      hierarchical: {
                //        direction: directionInput.value
                  //  }
                },
                physics:false
            };
            network = new vis.Network(container, data, options);


            network.on("afterDrawing", function(ctx) {
            var dataURL = ctx.canvas.toDataURL();
            document.getElementById('canvasImg').href = dataURL;
            })
        }

    </script>



</head>

<body onload="draw();">
<h2>Nesta Brain demo flowchart</h2>

<div id="mynetwork"></div>
<input type="button" value="Download image" onclick="document.getElementById('canvasImg').click();">
<a id="canvasImg" download="filename"></a>
</body>
</html>
