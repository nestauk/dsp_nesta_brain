<!doctype html>
<meta http-equiv="content-type" content="application/xhtml+xml; charset=utf-8" />
<html>
<head>
    <title>Nesta Brain demo flowchart</title>

    <style type="text/css">
        body {
            font: 10pt sans;
        }

        #mynetwork {
            width: 700px;
            height: 550px;
            background-color: white;
        }

    </style>
    <script type="text/javascript" src="https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="vis-4.21.0/dist/vis-network.min.css" rel="stylesheet" type="text/css"/>

    <!--DRAFT 1-->
    <script type="text/javascript">
        var nodes = null;
        var edges = null;
        var network = null;
        var directionInput = document.getElementById("direction");

        function destroy() {
            if (network !== null) {
                network.destroy();
                network = null;
            }
        }

        function draw() {
            destroy();
            var connectionCount = [];
            height = 40
            h_incr = height + 45;
            width = 150;
            w_incr = width + 80;
            nodes = [
                        {id: 'i1', x:0, y:h_incr*-2, label: "UI",group:'info'},
                        {id: 'i2', x:w_incr*1, y:h_incr*-2, label: "",group:'info'},
                        {id: 'i3', x:w_incr*2.5, y:h_incr*-2, label: "retriever",group:'info'},
                     //   {id: 'i4', x:w_incr*3, y:h_incr*-2, label: "Lance DB",group:'info'},
                    //    {id: 'ell', x:w_incr*0, y:h_incr*0.5, label: "\u22EE",group:'info'},
                        {id: 'sw', x:0, y:h_incr*-1, label: "sidebar widgets",group:'other'},
                        {id: 'fil', x:w_incr*1, y:h_incr*-1, label: "filter conditions",group:'other'},
                        {id: 'chh', x:0, y:h_incr*0, label: "chat history",group:"data_flow"},
                        {id: 'd1', x:w_incr*-1, y:h_incr*0,group:"dummy"},
                        {id: 'd2', x:w_incr*2, y:h_incr*0,group:"dummy"},
                        {id: 'd4', x:w_incr*-1, y:h_incr*1,group:"dummy"},
                        {id: 'ui', x:0, y:h_incr*1, label: "user input",group:"data_flow"},
                        {id: 'p1', x:w_incr*2, y:h_incr*1, label: "chat history contextualization prompt",group:'other'},
                        {id: 'llm1', x:w_incr*2, y:h_incr*2, label: "LLM",group:'other'},
                        {id: 'op1', x:w_incr*2, y:h_incr*3, label: "user input (contextualised)",group:"data_flow"},
                        {id: 'em', x:w_incr*2, y:h_incr*4, label: "embedding model",group:'other'},
                        {id: 'ev', x:w_incr*2, y:h_incr*5, label: "user input\n(embedding vector)",group:"data_flow"},
                        {id: 'ldb', x:w_incr*3, y:h_incr*5, label: "hybrid search",group:'other'},
                        {id: 'ch', x:w_incr*3, y:h_incr*6, label: "chunks",group:"data_flow"},
                        {id: 'cx', x:w_incr*1, y:h_incr*6, label: "context",group:"data_flow"},
                        {id: 'p2', x:w_incr*1, y:h_incr*7, label: "Q&A prompt",group:'other'},
                        {id: 'llm2', x:w_incr*1, y:h_incr*8, label: "LLM",group:'other'},
                        {id: 'd3', x:w_incr*-1, y:h_incr*7,group:"dummy"},
                        {id: 'op2', x:w_incr*0, y:h_incr*8, label: "response",group:"data_flow"},
                        {id: 'd5', x:w_incr*3, y:h_incr*-1,group:"dummy"},
                    ];

            edges = [
                         {from: 'chh', to: 'd1',arrows: {to:false}},
                         {from: 'd1', to: 'd3',arrows: {to:false}},
                         {from: 'd3', to: 'p2'},
                         {from: 'ui', to: 'd4',arrows: {to:false}},
                         {from: 'chh', to: 'd2',arrows: {to:false}},
                         {from: 'd2', to: 'p1'},
                         {from: 'ui', to: 'p1'},
                         {from: 'p1', to: 'llm1'},
                         {from: 'llm1', to: 'op1'},
                         {from: 'op1', to: 'em'},
                         {from: 'em', to: 'ev'},
                         {from: 'ev', to: 'ldb'},
                         {from: 'ldb', to: 'ch'},
                         {from: 'ch', to: 'cx'},
                         {from: 'cx', to: 'p2'},
                         {from: 'p2', to: 'llm2'},
                         {from: 'llm2', to: 'op2'},
                         {from: 'sw', to: 'fil'},
                         {from: 'fil', to: 'd5',arrows: {to:false}},
                         {from: 'd5', to: 'ldb'},
                        ];


            // create a network
            var container = document.getElementById('mynetwork');
            var data = {
                nodes: nodes,
                edges: edges
            };

            var options = {
                groups: {
                            dummy: {shape:'dot',color: {background:'white',border:'pink'},size:0},  //invisible nodes used for creating corners in arrows
                            info: {color: {background:'white',border:'white'},font: { size: 20}},
                         //   ghost: {color: {background:null,border:null}},
                            data_flow: {color: {background:'lightgrey',border:'grey'},font: { size: 20}},
                            other: {font: { size: 20}}
                       },
                nodes: {
                            shape: 'box',
                            color:{background:'#84c0f5'},
                            font: {size:14},
                            heightConstraint: {minimum: 40},
                            widthConstraint: {minimum: width, maximum:width}
                       },
                edges: {
                    color:{color:'#84c0f5'},
                    font: {size:10, background:'lightgrey'},
                    arrows: {to:true}
                },
                layout: {
              //      hierarchical: {
                //        direction: directionInput.value
                  //  }
                },
                physics:false
            };
            network = new vis.Network(container, data, options);


            network.on("afterDrawing", function(ctx) {
            var dataURL = ctx.canvas.toDataURL();
            document.getElementById('canvasImg').href = dataURL;
            })
        }

    </script>



</head>

<body onload="draw();">
<h2>Nesta Brain demo flowchart</h2>

<div id="mynetwork"></div>
<input type="button" value="Download image" onclick="document.getElementById('canvasImg').click();">
<a id="canvasImg" download="filename"></a>
</body>
</html>
